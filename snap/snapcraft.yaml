%YAML 1.1
---
# Snapcraft project file for the unofficial Bytecode Viewer snap
# ------------------------------
# This file is in the YAML data serialization format:
# http://yaml.org
# For the spec. of writing this file refer the following documentation:
# * The snapcraft format
#   https://docs.snapcraft.io/the-snapcraft-format/8337
# * Snap Documentation
#   https://docs.snapcraft.io
# * Topics under the doc category in the Snapcraft Forum
#   https://forum.snapcraft.io/c/doc
# For support refer to the snapcraft section in the Snapcraft Forum:
# https://forum.snapcraft.io/c/snapcraft

# All following comments, including this one, are designed to be stripped
# before contributing the recipe to the upstream

name: bytecode-viewer
title: Bytecode Viewer (UNOFFICIAL)
summary: An advanced yet user friendly Java Reverse Engineering suite
description: |
  Six different Java decompilers, two Bytecode editors, a Java compiler,
  plugins, searching, supports loading from Classes, Jars, Android APKs
  and more.

  **Features**

  - Easy to use yet extremely effective.
  - Written to run on Java 7, supports Java 8.
  - **Compile** Decompiled Java classes with Ranino Compiler.
  - Quickly decompile classes using JD-Core.
  - Easily edit APKs via Smali/Baksmali integration.
  - Java Decompiling with Six different decompilers (DJ-GUI/Core, Procyon,
    CFR, Fernflower, Krakatau, and JADX-Core).
  - Bytecode Decompiling with CFIDE.
  - Android APK integrated with Dex2Jar.
  - Securely launch Java applications and insert hooks via EZ-Injection.
  - Scan for malicious code with the Malicious Code Scanner plugin.
  - Export as DEX, Jar, Class, Zip or Java Source File.
  - Open Android APKs, Android DEX, Java Class Files and Java Jars. (WAR
    & JSP Support!)
  - Extensively configurable, **over 100+ settings**!
  - Works seamlessly with all Operating Systems.
  - Integrate BCV into Windows by installing it, it'll associate all .class,
    .dex and .apk to open with BCV.
  - View Jar & APK Resources with ease by APKTool.jar integration.
  - 100% free and open sourced under GPL v3 CopyLeft.

  **Snap-specific notes**

  This is NOT an official distribution of Bytecode Viewer, please avoid
  filing snap issues to the upstream's project issue tracker as they are
  not responsible for the snap packaging, use the "Contact _publisher_name_"
  link below instead.

  **Limitations**

  The PyPy 2.7 runtime (required by the Krakatau decompiler, disassembler,
  and assembler suite) and PyPy 3.x runtime (used by Enjarify) are only
  available on amd64 and arm64 architectures. On other architectures
  (e.g. armhf, riscv64), Krakatau and Enjarify features are unavailable
  unless compatible Python/PyPy runtimes are provided.

issues: https://github.com/brlin-tw/bytecode-viewer-snap/issues
contact: https://github.com/brlin-tw/bytecode-viewer-snap/issues
website: https://github.com/brlin-tw/bytecode-viewer-snap
source-code:
  - https://github.com/brlin-tw/bytecode-viewer-snap
  - https://github.com/Konloch/bytecode-viewer

# The path of icon to represent the snap, relative to the source tree directory
# Only PNG or SVG image is supported, dimension must be greater than 256x256px
icon: snap/gui/bcv-icon.200px.png

# The license of this application, in SPDX format
# NOTE: Currently only supports SPDX 2.1 license expressions, as described in Appendix IV of
# https://spdx.org/spdx-specification-21-web-version
# Supported expressions:
# https://github.com/snapcore/snapd/blob/HEAD/spdx/licenses.go
license: GPL-3.0

# Version string just for humans, typically '1.2+git' or '1.3.2'
# The wrapping single quotes are often required to avoid the version string
# being accidentally interpreted as a YAML non-string(like '1', '1.2').
# http://yaml.org/type
# https://arp242.net/weblog/yaml_probably_not_so_great_after_all.html#surprising-behaviour
# NOTE: This key is mutual exclusive with the `adopt-info` key
#version: Derived from the part specified by the `adopt-info` property
version: 2.13.2

# Extract metadata from the main snap part
# https://forum.snapcraft.io/t/extracting-information-from-sources-in-snapcraft-parts/4642
#adopt-info: main

# Snapd feature set and version the snap requires in order to work
# https://forum.snapcraft.io/t/snapcraft-top-level-metadata/8334#heading--assumes
assumes: []
  # DISABLED: Workaround canonical/snapcraft#4931
  #- command-chain

# Base runtime
# The common runtime for the snap to run on, or `bare` for static linked applications
base: core24
# https://docs.snapcraft.io/snapcraft-top-level-metadata/8334#heading--base

# Security confinement
# Use `devmode` to getting started
# Flip to `strict` once you have the right plugs and slots,
# or `classic` once you determine that strict confinement is not currently possible
confinement: strict

# Snap Grade
# Use `devel` to getting started
# Flip to `stable` once you determine that the snap is matured, only `stable` grade
# snaps can be promoted to `candidate` and `stable` channels
grade: stable

# gnome-46-2404 only supports the following architectures as of 2026/10/12
# https://snapcraft.io/gnome-46-2404
platforms:
  amd64:
  arm64:
  armhf:
  riscv64:

# Run `snapcraft help sources` for supported keywords on pulling a part's source ingredients
# Run `snapcraft plugins` for supported build helper plugins
# Run `snapcraft help plugins` for supported keywords on building a part
# For `override-*` scriptlets used to modify behavior of certain part's lifecycle phase, check out:
# https://docs.snapcraft.io/scriptlets/4892
parts:
  # Files to patch the files in the snap
  patching:
    source: snap/local/patching
    plugin: dump
    organize:
      '*': patching/
    prime:
      - -*

  # Launcher programs to fix problems at runtime
  launchers:
    source: snap/local/launchers
    plugin: dump
    organize:
      '*': bin/
    stage:
      - -bin/README.*

  homeishome-launch:
    plugin: nil
    stage-snaps:
      - homeishome-launch

  pypy-2-7:
    plugin: nil
    build-packages:
      - bzip2
      - curl
      - tar
    override-pull: |
      set_opts=(
        errexit
        nounset
      )
      for opt in "${set_opts[@]}"; do
        if ! set -o "${opt}"; then
          printf \
            'Error: Failed to set defensive interpreter behavior "%s".\n' \
            "${opt}" \
            1>&2
          exit 1
        fi
      done

      case "${CRAFT_ARCH_BUILD_FOR}" in
        amd64)
          archive_url="https://downloads.python.org/pypy/pypy2.7-v7.3.5-linux64.tar.bz2"
          expected_checksum="4858b347801fba3249ad90af015b3aaec9d57f54d038a58d806a1bd3217d5150"
          ;;
        arm64)
          archive_url="https://downloads.python.org/pypy/pypy2.7-v7.3.5-aarch64.tar.bz2"
          expected_checksum="8dc2c753f8a94eca1a304d7736c99b439c09274f492eaa3446770c6c32ed010e"
          ;;
        *)
          printf \
            'Info: PyPy 2.7 runtime is not available for "%s", skipping.\n' \
            "${CRAFT_ARCH_BUILD_FOR}"
          exit 0
          ;;
      esac

      archive_file="$(basename "${archive_url}")"
      if ! test -f "${archive_file}"; then
        curl \
          --fail \
          --location \
          --output "${archive_file}" \
          "${archive_url}"
      fi

      printf \
        '%s  %s\n' \
        "${expected_checksum}" \
        "${archive_file}" \
        | sha256sum --check --strict -

      mkdir -p "${CRAFT_PART_SRC}/opt/pypy2.7"
      tar \
        --extract \
        --bzip2 \
        --file="${archive_file}" \
        --strip-components=1 \
        --directory="${CRAFT_PART_SRC}/opt/pypy2.7"

    override-build: |
      set_opts=(
        errexit
        nounset
      )
      for opt in "${set_opts[@]}"; do
        if ! set -o "${opt}"; then
          printf \
            'Error: Failed to set defensive interpreter behavior "%s".\n' \
            "${opt}" \
            1>&2
          exit 1
        fi
      done

      if test -d "${CRAFT_PART_SRC}/opt/pypy2.7"; then
        mkdir -p "${CRAFT_PART_INSTALL}/opt"
        cp \
          --archive \
          "${CRAFT_PART_SRC}/opt/pypy2.7" \
          "${CRAFT_PART_INSTALL}/opt/pypy2.7"
      fi

    override-prime: |
      craftctl default

      if test -f "${CRAFT_PRIME}/opt/pypy2.7/bin/pypy"; then
        # Workaround upstream BCV looking for 'python' executable in PATH
        mkdir -p "${CRAFT_PRIME}/bin"
        ln \
          --symbolic \
          --force \
          ../opt/pypy2.7/bin/pypy \
          "${CRAFT_PRIME}/bin/python"
        ln \
          --symbolic \
          --force \
          ../opt/pypy2.7/bin/pypy \
          "${CRAFT_PRIME}/bin/pypy"
        ln \
          --symbolic \
          --force \
          ../opt/pypy2.7/bin/pypy \
          "${CRAFT_PRIME}/bin/pypy2"
        ln \
          --symbolic \
          --force \
          ../opt/pypy2.7/bin/pypy \
          "${CRAFT_PRIME}/bin/python2"
      fi

  pypy-3:
    plugin: nil
    build-packages:
      - curl
      - gzip
      - tar
    override-pull: |
      set_opts=(
        errexit
        nounset
      )
      for opt in "${set_opts[@]}"; do
        if ! set -o "${opt}"; then
          printf \
            'Error: Failed to set defensive interpreter behavior "%s".\n' \
            "${opt}" \
            1>&2
          exit 1
        fi
      done

      case "${CRAFT_ARCH_BUILD_FOR}" in
        amd64)
          archive_url="https://downloads.python.org/pypy/pypy3.10-v7.3.19-linux64.tar.gz"
          expected_checksum="abfbb05bb3691e694cf9307635d14d0866f0a85429df8958c110e3de168706b4"
          ;;
        arm64)
          archive_url="https://downloads.python.org/pypy/pypy3.10-v7.3.19-aarch64.tar.gz"
          expected_checksum="598b73e166c4ce215f327cc1579c54ead8f2b048de429d5b77c5d0a2edb2f566"
          ;;
        *)
          printf \
            'Info: PyPy 3.x runtime is not available for "%s", skipping.\n' \
            "${CRAFT_ARCH_BUILD_FOR}"
          exit 0
          ;;
      esac

      archive_file="$(basename "${archive_url}")"
      if ! test -f "${archive_file}"; then
        curl \
          --fail \
          --location \
          --output "${archive_file}" \
          "${archive_url}"
      fi

      printf \
        '%s  %s\n' \
        "${expected_checksum}" \
        "${archive_file}" \
        | sha256sum --check --strict -

      mkdir -p "${CRAFT_PART_SRC}/opt/pypy3"
      tar \
        --extract \
        --gzip \
        --file="${archive_file}" \
        --strip-components=1 \
        --directory="${CRAFT_PART_SRC}/opt/pypy3"

    override-build: |
      set_opts=(
        errexit
        nounset
      )
      for opt in "${set_opts[@]}"; do
        if ! set -o "${opt}"; then
          printf \
            'Error: Failed to set defensive interpreter behavior "%s".\n' \
            "${opt}" \
            1>&2
          exit 1
        fi
      done

      if test -d "${CRAFT_PART_SRC}/opt/pypy3"; then
        mkdir -p "${CRAFT_PART_INSTALL}/opt"
        cp \
          --archive \
          "${CRAFT_PART_SRC}/opt/pypy3" \
          "${CRAFT_PART_INSTALL}/opt/pypy3"
      fi

    override-prime: |
      craftctl default

      if test -f "${CRAFT_PRIME}/opt/pypy3/bin/pypy3"; then
        # Workaround upstream BCV looking for 'python3' executable in PATH
        mkdir -p "${CRAFT_PRIME}/bin"
        ln \
          --symbolic \
          --force \
          ../opt/pypy3/bin/pypy3 \
          "${CRAFT_PRIME}/bin/python3"
        ln \
          --symbolic \
          --force \
          ../opt/pypy3/bin/pypy3 \
          "${CRAFT_PRIME}/bin/pypy3"
      fi

  main:
    after:
      # for patch-desktop-entries.*
      - patching

    source: https://github.com/Konloch/bytecode-viewer.git
    source-tag: v${CRAFT_PROJECT_VERSION}
    plugin: maven
    maven-parameters:
      - -B
      - package
      - -DskipTests
    build-packages:
      - maven
      - default-jdk-headless
      - ca-certificates-java
      - python3
    organize:
      target/Bytecode-Viewer-*.jar: .
    stage-packages:
      - default-jdk-headless

    override-prime: |
      set -o nounset

      craftctl default

      # Fix missing interpreter executable symbolic link
      ln \
        --symbolic \
        --force \
        ../usr/lib/jvm/default-java/bin/java \
        bin/java

      # Fix missing compiler executable symbolic link
      ln \
        --symbolic \
        --force \
        ../usr/lib/jvm/default-java/bin/javac \
        bin/javac

      # Fix missing truststore
      cp \
        --force \
        /etc/ssl/certs/java/cacerts \
        etc/ssl/certs/java/cacerts

      # Workaround Krakatau decompiler requiring rt.jar on Java 9+ runtimes
      # Java 9+ stores standard classes in lib/modules (jimage) rather than rt.jar.
      # Krakatau expects rt.jar to resolve standard Java class hierarchies.
      # Pre-extracting rt.jar into the default-java runtime allows Krakatau
      # to work out of the box without runtime extraction delay or ClassLoaderError.
      modules_file="${CRAFT_PRIME}/usr/lib/jvm/default-java/lib/modules"
      rt_jar_file="${CRAFT_PRIME}/usr/lib/jvm/default-java/lib/rt.jar"
      if test -f "${modules_file}"; then
        temp_extract_dir="$(mktemp --directory)"
        jimage extract \
          --dir="${temp_extract_dir}" \
          "${modules_file}"

        "${CRAFT_PROJECT_DIR}/snap/local/scriptlets/create-rt-jar" \
          "${temp_extract_dir}" \
          "${rt_jar_file}"

        rm -rf "${temp_extract_dir}"
      fi

# Apps that are exposed by the snap package
# If the _app_name_ is identical with the _snap_name_ it can be directly run
# with `_snap_name_` or `snap run _snap_name_` commands, otherwise it can only be run
# via `_snap_name_._app_name_` or `snap run _snap_name_._app_name_`
apps:
  bytecode-viewer:
    command: bin/bytecode-viewer-launch
    command-chain:
      - bin/homeishome-launch
    extensions:
      - gnome
    plugs:
      - home
      - removable-media
      - network
      - network-bind

lint:
  ignore:
    - library:
        - usr/lib/jvm/**
        - opt/pypy*/lib/*.so*
